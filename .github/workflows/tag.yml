name: Snapshot Gating Test
on:
  push:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Fake Version Check
        id: snapshot-version-check
        run: |
          echo "is_snapshot_version=false" >> $GITHUB_OUTPUT

      - name: Step 4 Would Run Here
        if: steps.snapshot-version-check.outputs.is_snapshot_version == 'true'
        run: |
          echo "✓ Step-4 started"
          echo "(real work would happen here)"
